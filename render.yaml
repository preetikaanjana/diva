# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: diva
    runtime: node
    plan: free
    buildCommand: npm install --prefix server && cd client && npm ci && npm run build
    startCommand: NODE_ENV=production node server/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Set in the Render dashboard (Blueprint sync: false) — do not commit credentials
      - key: MONGODB_URI
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: llama-3.1-8b-instant
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: CLIENT_ORIGIN
        sync: false
